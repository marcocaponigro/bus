<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellone Bus Live - Conca d'Oro</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffcc00; font-size: 2.2em; margin: 15px 0 5px 0; text-transform: uppercase; }
        .stazione { color: #888; font-size: 1.1em; margin-bottom: 25px; letter-spacing: 1px; }
        .tabellone {
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 5px 20px;
        }
        .riga-bus {
            font-size: 2.2em;
            font-weight: bold;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .riga-bus:last-child { border-bottom: none; }
        .linea { color: #ffcc00; background: #222; padding: 2px 12px; border-radius: 6px; }
        .tempo { color: #00ff66; }
        .errore { color: #ff3333; font-size: 1.4em; padding: 20px; }
        .loading { color: #aaa; font-size: 1.5em; padding: 30px; }
    </style>
</head>
<body>

    <h1>PARTENZE BUS LIVE</h1>
    <div class="stazione">Conca D'oro (MB1) - Palina 81844</div>

    <div class="tabellone" id="tabellone">
        <div class="loading">Interrogazione server ArcGIS Roma...</div>
    </div>

    <script>
        async function aggiornaDalVivo() {
            const container = document.getElementById('tabellone');
            
            // Interroghiamo direttamente l'endpoint pubblico ArcGIS di Roma Mobilità per i tempi di attesa
            const urlArcGIS = "https://romamobilita.it";
            
            // Utilizziamo un proxy CORS solido per le richieste testuali JSON
            const proxyUrl = "https://allorigins.win" + encodeURIComponent(urlArcGIS);

            try {
                const risposta = await fetch(proxyUrl);
                if (!risposta.ok) throw new Error("Errore di rete");
                
                const wrapper = await risposta.json();
                // Allorigins inserisce la risposta testuale dentro la chiave .contents
                const datiStr = wrapper.contents;
                const dati = JSON.parse(datiStr);
                
                // La struttura delle API di Roma Mobilità restituisce la lista dentro "previsioni" o "arrivi"
                const arrivi = dati.previsioni || dati.arrivi || [];
                let busTrovati = [];

                arrivi.forEach(bus => {
                    // Estraiamo il nome della linea (es: 80, 38) e il tempo stimato
                    const nomeLinea = bus.linea || bus.route_id || bus.nomeLinea;
                    let tempoAttesa = bus.tempo_attesa || bus.previsione || bus.a_bordo;
                    
                    if (nomeLinea && tempoAttesa) {
                        // Formattiamo il testo per renderlo elegante (es: "In Arrivo" o "5 min")
                        if (tempoAttesa === "0" || tempoAttesa.toLowerCase().includes("arrivo")) {
                            tempoAttesa = "In Arrivo";
                        } else if (!tempoAttesa.toLowerCase().includes("min")) {
                            tempoAttesa = tempoAttesa + " min";
                        }
                        
                        busTrovati.push({ 
                            linea: nomeLinea, 
                            tempo: tempoAttesa,
                            minuti: parseInt(tempoAttesa) || 0 
                        });
                    }
                });

                // Ordiniamo i bus in base a chi arriva prima
                busTrovati.sort((a, b) => a.minuti - b.minuti);

                if (busTrovati.length === 0) {
                    container.innerHTML = `<div class="errore">Nessun autobus rilevato in arrivo.<br><small>Verifica se la linea è attiva in questa fascia oraria.</small></div>`;
                    return;
                }

                container.innerHTML = "";
                busTrovati.forEach(bus => {
                    container.innerHTML += `
                        <div class="riga-bus">
                            <span class="linea">🚌 ${bus.linea}</span>
                            <span class="tempo">${bus.tempo}</span>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="errore">Collegamento ai dati di Roma fallito.<br><small>Nuovo tentativo tra poco...</small></div>`;
            }
        }

        // Avvio immediato al caricamento
        aggiornaDalVivo();
        
        // Il tablet aggiornerà lo schermo da solo ogni 30 secondi in tempo reale
        setInterval(aggiornaDalVivo, 30000);
    </script>
</body>
</html>
