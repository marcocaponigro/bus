name: Probe GTFS realtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-gtfs-rt.yml"
      - "scripts/probe_gtfs_rt.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install GTFS realtime bindings
        run: python -m pip install --disable-pip-version-check gtfs-realtime-bindings

      - name: Probe current feed
        run: python scripts/probe_gtfs_rt.py

      - name: Commit probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rt_probe.json
          if git diff --cached --quiet; then
            echo "Probe unchanged"
          else
            git commit -m "Probe current GTFS realtime feed"
            git push
          fi
