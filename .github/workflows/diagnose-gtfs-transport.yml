name: Diagnose GTFS transport

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-gtfs-transport.yml"
      - "scripts/diagnose_gtfs_transport.py"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Inspect feed headers
        run: python scripts/diagnose_gtfs_transport.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rt_headers.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Record GTFS realtime transport headers"
            git push
          fi
