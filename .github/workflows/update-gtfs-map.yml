name: Update GTFS trip map

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/update-gtfs-map.yml"
      - "scripts/build_gtfs_map.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build stop 81844 trip map
        run: python scripts/build_gtfs_map.py

      - name: Commit updated map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtfs_trip_map.json
          if git diff --cached --quiet; then
            echo "GTFS map unchanged"
          else
            git commit -m "Update GTFS trip map for stop 81844"
            git push
          fi
